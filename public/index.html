<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - Marcador</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    .group { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    .flex { display: flex; gap: 10px; margin-top: 10px; }
    button { flex: 1; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; }
    .btn-green { background: #28a745; color: white; }
    .btn-red { background: #dc3545; color: white; }
    .btn-blue { background: #007bff; color: white; }
    .btn-yellow { background: #ffc107; color: #000; font-size: 1.1em; text-transform: uppercase; }
  </style>
</head>
<body>

  <h1>Control de Marcador</h1>

  <div class="group">
    <label>Categoría / Torneo:</label>
    <input type="text" id="category" value="CATEGORIA 2014">

    <label>Equipo Local:</label>
    <input type="text" id="homeName" value="LOCAL">
    <label>Logo Local (URL):</label>
    <input type="text" id="homeLogo">

    <label>Equipo Visitante:</label>
    <input type="text" id="awayName" value="VISITANTE">
    <label>Logo Visitante (URL):</label>
    <input type="text" id="awayLogo">

    <label>Fondo TV (URL):</label>
    <input type="text" id="bgUrl">
    
    <label>Periodo:</label>
    <select id="period">
      <option value="1T">1T (Primer Tiempo)</option>
      <option value="2T">2T (Segundo Tiempo)</option>
      <option value="ET">ET (Entre Tiempo)</option>
      <option value="ST">ST (Sin Tiempo)</option>
    </select>
    
    <button class="btn-blue" style="width:100%; margin-top:15px;" onclick="saveInfo()">Guardar Nombres / Logos</button>
  </div>

  <!-- BANDERAS DE GOL DIRECTO CON ANIMACIÓN -->
  <div class="group">
    <h3>Animación de Gol</h3>
    <div class="flex">
      <button class="btn-yellow" onclick="triggerGoal('home')">⚽ ¡GOL LOCAL!</button>
      <button class="btn-yellow" onclick="triggerGoal('away')">⚽ ¡GOL VISITANTE!</button>
    </div>
  </div>

  <div class="group">
    <h3>Marcador Manual</h3>
    <p>Local: <span id="lblHome">0</span> | Visitante: <span id="lblAway">0</span></p>
    <div class="flex">
      <button class="btn-green" onclick="addScore('home', 1)">+1 Local</button>
      <button class="btn-red" onclick="addScore('home', -1)">-1 Local</button>
    </div>
    <div class="flex">
      <button class="btn-green" onclick="addScore('away', 1)">+1 Visitante</button>
      <button class="btn-red" onclick="addScore('away', -1)">-1 Visitante</button>
    </div>
  </div>

  <div class="group">
    <h3>Reloj: <span id="lblTimer">00:00</span></h3>
    <div class="flex">
      <button class="btn-green" onclick="toggleTimer(true)">Iniciar</button>
      <button class="btn-red" onclick="toggleTimer(false)">Pausar</button>
    </div>
    <div class="flex">
      <input type="number" id="customMin" placeholder="Minutos" style="width: 50%;">
      <button class="btn-blue" onclick="setTimer()">Ajustar Minutos</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentState = {};

    socket.on('updateState', (state) => {
      currentState = state;
      document.getElementById('lblHome').innerText = state.homeScore;
      document.getElementById('lblAway').innerText = state.awayScore;
      
      let mins = Math.floor(state.seconds / 60).toString().padStart(2, '0');
      let secs = (state.seconds % 60).toString().padStart(2, '0');
      document.getElementById('lblTimer').innerText = `${mins}:${secs}`;
    });

    function saveInfo() {
      socket.emit('updateState', {
        category: document.getElementById('category').value,
        homeName: document.getElementById('homeName').value,
        homeLogo: document.getElementById('homeLogo').value,
        awayName: document.getElementById('awayName').value,
        awayLogo: document.getElementById('awayLogo').value,
        bgUrl: document.getElementById('bgUrl').value,
        period: document.getElementById('period').value
      });
    }

    function addScore(team, val) {
      if (team === 'home') {
        let newScore = Math.max(0, currentState.homeScore + val);
        socket.emit('updateState', { homeScore: newScore });
      } else {
        let newScore = Math.max(0, currentState.awayScore + val);
        socket.emit('updateState', { awayScore: newScore });
      }
    }

    function toggleTimer(running) {
      socket.emit('updateState', { timerRunning: running });
    }

    function setTimer() {
      let min = parseInt(document.getElementById('customMin').value) || 0;
      socket.emit('updateState', { seconds: min * 60 });
    }

    // Disparar la animación de gol y sumar el punto
    function triggerGoal(team) {
      if (team === 'home') {
        socket.emit('updateState', { homeScore: currentState.homeScore + 1 });
        socket.emit('triggerGoal', { teamName: currentState.homeName || 'LOCAL' });
      } else {
        socket.emit('updateState', { awayScore: currentState.awayScore + 1 });
        socket.emit('triggerGoal', { teamName: currentState.awayName || 'VISITANTE' });
      }
    }
  </script>
</body>
</html>
