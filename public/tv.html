<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcador TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000 url('') no-repeat center center / cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px;
      position: relative;
    }

    /* TOP BAR */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .live-pill {
      background: #f59e0b;
      color: #000;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* SCOREBOARD PRINCIPAL */
    .scoreboard {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      width: 90%;
      max-width: 1100px;
      padding: 30px 40px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .team.home { justify-content: flex-start; }
    .team.away { justify-content: flex-end; flex-row-reverse; text-align: right; }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background: #fff;
      border-radius: 50%;
      padding: 5px;
    }

    .team-name {
      color: #fff;
      font-size: 2.2rem;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
      max-width: 280px;
    }

    .score-container {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .score {
      font-size: 5.5rem;
      font-weight: 900;
      color: #38bdf8;
      width: 80px;
      text-align: center;
      line-height: 1;
    }

    .divider {
      width: 2px;
      height: 80px;
      background: rgba(255,255,255,0.2);
    }

    /* TIMER BOTTOM */
    .timer-container {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 10px 25px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(10px);
    }

    .period {
      background: #ef4444;
      color: #fff;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 1.2rem;
    }

    .timer {
      color: #fff;
      font-size: 2.5rem;
      font-family: monospace;
      font-weight: bold;
    }

    /* OVERLAY GOOOL DE 3 SEGUNDOS */
    #golOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    #golOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .gol-text {
      font-size: 9rem;
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 0 0 30px #f59e0b, 0 0 60px #ef4444;
      letter-spacing: 5px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gol-team {
      font-size: 3.5rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      margin-top: 10px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    @keyframes popIn {
      0% { transform: scale(0.3); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    <div class="badge-pill" id="categoryText">CATEGORIA 2014</div>
    <div class="badge-pill" style="border-color: #38bdf8;">VILLA SOLDATI</div>
    <div class="live-pill">PARTIDO EN VIVO</div>
  </div>

  <!-- TABLERO PRINCIPAL -->
  <div class="scoreboard">
    <div class="team home">
      <img id="homeLogo" class="logo" src="" alt="Local" style="display:none;">
      <div class="team-name" id="homeName">LOCAL</div>
    </div>

    <div class="score-container">
      <div class="score" id="homeScore">0</div>
      <div class="divider"></div>
      <div class="score" id="awayScore">0</div>
    </div>

    <div class="team away">
      <img id="awayLogo" class="logo" src="" alt="Visitante" style="display:none;">
      <div class="team-name" id="awayName">VISITANTE</div>
    </div>
  </div>

  <!-- CRONÓMETRO Y PERIODO -->
  <div class="timer-container">
    <div class="period" id="periodText">1T</div>
    <div class="timer" id="timerText">00:00</div>
  </div>

  <!-- OVERLAY DE GOL -->
  <div id="golOverlay">
    <div class="gol-text">¡GOOOOL!</div>
    <div class="gol-team" id="golTeamName">C.S.D. JUVENTUD UNIDA</div>
  </div>

<script>
  const socket = io();

  let previousHomeScore = null;
  let previousAwayScore = null;
  let golTimeout = null;

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function triggerGolAnimation(teamName) {
    const overlay = document.getElementById('golOverlay');
    const teamLabel = document.getElementById('golTeamName');

    teamLabel.textContent = teamName || '';
    overlay.classList.add('show');

    if (golTimeout) clearTimeout(golTimeout);

    // Oculta el cartel exactamente después de 3 segundos (3000 ms)
    golTimeout = setTimeout(() => {
      overlay.classList.remove('show');
    }, 3000);
  }

  socket.on('updateState', (state) => {
    // Detectar aumento de gol para Local
    if (previousHomeScore !== null && state.homeScore > previousHomeScore) {
      triggerGolAnimation(state.homeName);
    }

    // Detectar aumento de gol para Visitante
    if (previousAwayScore !== null && state.awayScore > previousAwayScore) {
      triggerGolAnimation(state.awayName);
    }

    // Actualizar marcadores de referencia
    previousHomeScore = state.homeScore;
    previousAwayScore = state.awayScore;

    // Actualización de la interfaz
    document.getElementById('categoryText').textContent = state.category || 'CATEGORIA 2014';
    document.getElementById('homeName').textContent = state.homeName || 'LOCAL';
    document.getElementById('awayName').textContent = state.awayName || 'VISITANTE';
    document.getElementById('homeScore').textContent = state.homeScore;
    document.getElementById('awayScore').textContent = state.awayScore;
    document.getElementById('periodText').textContent = state.period || '1T';
    document.getElementById('timerText').textContent = formatTime(state.seconds || 0);

    // Fondo de pantalla dinámico
    if (state.bgUrl) {
      document.body.style.backgroundImage = `url('${state.bgUrl}')`;
    }

    // Logos
    const homeLogoImg = document.getElementById('homeLogo');
    if (state.homeLogo) {
      homeLogoImg.src = state.homeLogo;
      homeLogoImg.style.display = 'block';
    } else {
      homeLogoImg.style.display = 'none';
    }

    const awayLogoImg = document.getElementById('awayLogo');
    if (state.awayLogo) {
      awayLogoImg.src = state.awayLogo;
      awayLogoImg.style.display = 'block';
    } else {
      awayLogoImg.style.display = 'none';
    }
  });
</script>

</body>
</html>
