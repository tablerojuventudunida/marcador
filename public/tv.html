
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero TV Profesional</title>
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #060913;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      font-family: 'Impact', 'Trebuchet MS', 'Arial Black', sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2.5vh 3vw;
      overflow: hidden;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle,
        rgba(15,23,42,0.6) 0%,
        rgba(6,9,19,0.95) 100%
      );
      z-index: 1;
    }

    /* ================================
       ENCABEZADO SUPERIOR
       ================================ */

    .top-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 12vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .category-badge {
      font-size: clamp(42px, 5vw, 90px);
      font-weight: 900;
      color: #ffffff;
      background: rgba(15, 23, 42, 0.9);
      padding: 16px 48px;
      border-radius: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      text-align: center;
      white-space: nowrap;
    }


    /* ================================
       CONTENEDOR PRINCIPAL
       ================================ */

    .main-container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      min-height: 0;
      gap: 20px;
    }

    /* ================================
       MARCADOR
       ================================ */

    .scoreboard {
      display: flex;
      width: 100%;
      height: 60vh;
      max-height: 650px;
      min-height: 320px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .team-card {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 1vw;
      gap: 1vw;
    }

    /* Equipo visitante: escudo a la derecha */

    .away-team {
      flex-direction: row-reverse;
    }

    /* ================================
       ESCUDOS GRANDES
       ================================ */

    .shield-box {
      width: clamp(240px, 42vh, 420px);
      height: clamp(240px, 42vh, 420px);
      flex-shrink: 0;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      border: 5px solid rgba(255, 255, 255, 0.5);
      clip-path: circle(50% at 50% 50%);
    }

    .shield-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* ================================
       RESULTADOS
       ================================ */

    .score {
      font-size: clamp(110px, 17vw, 300px);
      font-weight: 900;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 35px rgba(56, 189, 248, 0.7),
        4px 4px 0px #000;
      line-height: 1;
      padding: 0 1vw;
      -webkit-text-stroke: 2px #0284c7;
      flex-shrink: 0;
    }

    .vs-divider {
      width: 3px;
      height: 75%;
      background: rgba(255, 255, 255, 0.25);
      align-self: center;
      flex-shrink: 0;
    }

    /* ================================
       RELOJ MÁS GRANDE
       ================================ */

    .timer-card {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4vw;
      background: rgba(15, 23, 42, 0.95);
      padding: 15px 65px;
      min-height: 13vh;
      border-radius: 25px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      margin-bottom: 1vh;
    }

    .period-tag {
      font-size: clamp(36px, 4.5vw, 75px);
      font-weight: 900;
      color: #ffffff;
      background: #ef4444;
      padding: 8px 28px;
      border-radius: 12px;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
    }

    .timer-text {
      font-size: clamp(72px, 8vw, 135px);
      font-weight: 900;
      font-family: 'Impact', monospace;
      color: #ffffff;
      letter-spacing: 5px;
      text-shadow: 3px 3px 5px rgba(0,0,0,0.8);
      line-height: 1;
      white-space: nowrap;
    }

    /* ================================
       ANIMACIÓN DE GOL
       ================================ */

    .goal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 9, 19, 0.96);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    .goal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .goal-title {
      font-size: 14vw;
      font-weight: 900;
      color: #f59e0b;
      text-shadow:
        0 0 60px rgba(245, 158, 11, 0.9),
        0 0 20px #ffffff;
      letter-spacing: 10px;
      transform: scale(0.5);
      transition:
        transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-text-stroke: 3px #78350f;
    }

    .goal-overlay.active .goal-title {
      transform: scale(1);
      animation: pulse 0.8s infinite alternate;
    }

    .goal-team {
      font-size: 6vw;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 5px;
      margin-top: -20px;
      text-shadow:
        0 0 25px rgba(255, 255, 255, 0.8),
        3px 3px 0px #000;
      -webkit-text-stroke: 1.5px #000;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.08);
      }
    }

    /* Destello al marcar gol */

    .goal-overlay.active::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at center,
        rgba(255,255,255,0.22) 0%,
        rgba(245,158,11,0.10) 30%,
        transparent 65%
      );
      animation: goalFlash 0.7s ease-out;
      pointer-events: none;
    }

    @keyframes goalFlash {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      35% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.2);
      }
    }

    /* ================================
       AJUSTES PARA PANTALLAS BAJAS
       ================================ */

    @media (max-height: 800px) {
      .scoreboard {
        height: 60vh;
        min-height: 320px;
      }

      .shield-box {
        width: clamp(220px, 45vh, 340px);
        height: clamp(220px, 45vh, 340px);
      }

      .timer-card {
        min-height: 11vh;
        padding: 10px 45px;
      }
    }

  </style>
</head>

<body>

  <div class="overlay"></div>

  <!-- ANIMACIÓN DE GOL -->

  <div class="goal-overlay" id="goalOverlay">
    <div class="goal-title">¡¡GOOOOOL!!</div>
    <div class="goal-team" id="goalTeamName">EQUIPO</div>
  </div>


  <!-- ENCABEZADO -->

  <div class="top-bar">

    <div
      class="category-badge"
      id="categoryName"
    >
      CATEGORIA 2014
    </div>

  </div>


  <!-- MARCADOR -->

  <div class="main-container">

    <div class="scoreboard">

      <!-- LOCAL -->

      <div class="team-card">

        <div
          class="shield-box"
          id="homeShieldContainer"
          style="display: none;"
        >
          <img
            id="homeBadge"
            src=""
            alt=""
          >
        </div>

        <div
          class="score"
          id="homeScore"
        >
          0
        </div>

      </div>


      <div class="vs-divider"></div>


      <!-- VISITANTE -->

      <div class="team-card away-team">

        <div
          class="shield-box"
          id="awayShieldContainer"
          style="display: none;"
        >
          <img
            id="awayBadge"
            src=""
            alt=""
          >
        </div>

        <div
          class="score"
          id="awayScore"
        >
          0
        </div>

      </div>

    </div>

  </div>


  <!-- RELOJ -->

  <div class="timer-card">

    <div
      class="period-tag"
      id="period"
    >
      1T
    </div>

    <div
      class="timer-text"
      id="clock"
    >
      00:00
    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    const socket = io();

    let goalTimeout = null;

    /*
     * Guardamos el marcador anterior.
     * Evita animaciones al cargar o refrescar la TV.
     */

    let previousHomeScore = null;
    let previousAwayScore = null;


    function formatTime(totalSeconds) {

      const m = Math.floor(totalSeconds / 60)
        .toString()
        .padStart(2, '0');

      const s = (totalSeconds % 60)
        .toString()
        .padStart(2, '0');

      return `${m}:${s}`;
    }


    /*
     * MOSTRAR ANIMACIÓN DE GOL
     */

    function showGoal(teamName) {

      const overlay =
        document.getElementById('goalOverlay');

      const teamText =
        document.getElementById('goalTeamName');

      if (!overlay || !teamText) {
        return;
      }

      teamText.innerText =
        teamName || '¡GOL!';

      overlay.classList.add('active');

      if (goalTimeout) {
        clearTimeout(goalTimeout);
      }

      goalTimeout = setTimeout(() => {

        overlay.classList.remove('active');

      }, 5000);

    }


    /*
     * RECIBIR ACTUALIZACIONES DEL MARCADOR
     */

    socket.on('updateState', (state) => {


      /* ================================
         ACTUALIZAR MARCADORES
         ================================ */

      document.getElementById('homeScore').innerText =
        state.homeScore;

      document.getElementById('awayScore').innerText =
        state.awayScore;


      /* ================================
         ACTUALIZAR RELOJ
         ================================ */

      document.getElementById('clock').innerText =
        formatTime(state.seconds);

      document.getElementById('period').innerText =
        state.period;


      /* ================================
         CATEGORÍA
         ================================ */

      const catElem =
        document.getElementById('categoryName');

      if (state.category) {

        catElem.innerText = state.category;
        catElem.style.visibility = 'visible';

      } else {

        catElem.style.visibility = 'hidden';

      }


      /* ================================
         ESCUDO LOCAL
         ================================ */

      const homeBadge =
        document.getElementById('homeBadge');

      const homeBox =
        document.getElementById('homeShieldContainer');

      if (
        state.homeLogo &&
        state.homeLogo.trim() !== ''
      ) {

        homeBadge.src = state.homeLogo;
        homeBox.style.display = 'flex';

      } else {

        homeBox.style.display = 'none';

      }


      /* ================================
         ESCUDO VISITANTE
         ================================ */

      const awayBadge =
        document.getElementById('awayBadge');

      const awayBox =
        document.getElementById('awayShieldContainer');

      if (
        state.awayLogo &&
        state.awayLogo.trim() !== ''
      ) {

        awayBadge.src = state.awayLogo;
        awayBox.style.display = 'flex';

      } else {

        awayBox.style.display = 'none';

      }


      /* ================================
         FONDO
         ================================ */

      if (
        state.bgUrl &&
        state.bgUrl.trim() !== ''
      ) {

        document.body.style.backgroundImage =
          `url('${state.bgUrl}')`;

      } else {

        document.body.style.backgroundImage =
          'none';

      }


      /* ================================
         DETECCIÓN AUTOMÁTICA DE GOL
         ================================ */

      const currentHomeScore =
        Number(state.homeScore);

      const currentAwayScore =
        Number(state.awayScore);


      if (
        previousHomeScore !== null &&
        previousAwayScore !== null
      ) {

        /* GOL LOCAL */

        if (currentHomeScore > previousHomeScore) {

          showGoal(
            state.homeName || 'LOCAL'
          );

        }

        /* GOL VISITANTE */

        else if (
          currentAwayScore > previousAwayScore
        ) {

          showGoal(
            state.awayName || 'VISITANTE'
          );

        }

      }


      previousHomeScore = currentHomeScore;
      previousAwayScore = currentAwayScore;

    });


    /*
     * EVENTO DE GOL MANUAL
     */

    socket.on('triggerGoal', (data) => {

      showGoal(
        data.teamName || '¡GOL!'
      );

    });

  </script>

</body>
</html>
