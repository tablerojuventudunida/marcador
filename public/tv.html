<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
    }

    /* BARRA SUPERIOR DEL MARCADOR */
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      border-radius: 8px;
      padding: 10px 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin: 0 8px;
    }

    .team-name {
      font-size: 20px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 0 10px;
    }

    .score {
      font-size: 26px;
      background: #ffcc00;
      color: black;
      padding: 2px 12px;
      border-radius: 5px;
      margin: 0 5px;
    }

    .timer-box {
      margin-left: 15px;
      border-left: 2px solid #555;
      padding-left: 15px;
      text-align: center;
    }

    .timer {
      font-size: 22px;
      color: #00ffcc;
    }

    .period {
      font-size: 12px;
      color: #aaa;
    }

    /* OVERLAY / CARTEL ANIMADO DE GOL */
    #goal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }

    #goal-overlay.active {
      opacity: 1;
    }

    .goal-title {
      font-size: 110px;
      color: #ffcc00;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ffcc00;
      animation: pulse 0.6s infinite alternate;
      margin: 0;
      text-transform: uppercase;
    }

    .goal-team {
      font-size: 50px;
      color: white;
      margin-top: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      text-transform: uppercase;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div id="scoreboard">
    <span class="team-name" id="homeName">LOCAL</span>
    <img id="homeLogo" class="team-logo" style="display:none;">
    <span class="score" id="homeScore">0</span>
    <span>-</span>
    <span class="score" id="awayScore">0</span>
    <img id="awayLogo" class="team-logo" style="display:none;">
    <span class="team-name" id="awayName">VISITANTE</span>

    <div class="timer-box">
      <div class="timer" id="timer">00:00</div>
      <div class="period" id="period">1T</div>
    </div>
  </div>

  <!-- CARTEL DE GOL -->
  <div id="goal-overlay">
    <h1 class="goal-title">¡¡GOOOOOL!!</h1>
    <div class="goal-team" id="goalTeamName">EQUIPO</div>
  </div>

  <script>
    const socket = io();

    socket.on('updateState', (state) => {
      document.getElementById('homeName').innerText = state.homeName || 'LOCAL';
      document.getElementById('awayName').innerText = state.awayName || 'VISITANTE';
      document.getElementById('homeScore').innerText = state.homeScore;
      document.getElementById('awayScore').innerText = state.awayScore;
      document.getElementById('period').innerText = state.period || '1T';

      let mins = Math.floor(state.seconds / 60).toString().padStart(2, '0');
      let secs = (state.seconds % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;

      if (state.homeLogo) {
        document.getElementById('homeLogo').src = state.homeLogo;
        document.getElementById('homeLogo').style.display = 'inline';
      } else {
        document.getElementById('homeLogo').style.display = 'none';
      }

      if (state.awayLogo) {
        document.getElementById('awayLogo').src = state.awayLogo;
        document.getElementById('awayLogo').style.display = 'inline';
      } else {
        document.getElementById('awayLogo').style.display = 'none';
      }
    });

    // Escuchar el disparo de Gol
    socket.on('triggerGoal', (data) => {
      const overlay = document.getElementById('goal-overlay');
      const teamLabel = document.getElementById('goalTeamName');

      teamLabel.innerText = data.teamName;
      overlay.classList.add('active');

      // Ocultar la animación automáticamente a los 5 segundos
      setTimeout(() => {
        overlay.classList.remove('active');
      }, 5000);
    });
  </script>
</body>
</html>
