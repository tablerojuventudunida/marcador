<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador TV</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
    }

    /* BARRA SUPERIOR DEL MARCADOR */
    #scoreboard {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      color: white;
      border-radius: 12px;
      padding: 10px 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .team-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      margin: 0 10px;
    }

    .team-name {
      font-size: 22px;
      font-weight: bold;
      text-transform: uppercase;
      padding: 0 10px;
    }

    .score {
      font-size: 28px;
      background: #38bdf8;
      color: #0f172a;
      padding: 4px 14px;
      border-radius: 8px;
      margin: 0 5px;
      font-weight: 900;
    }

    .timer-box {
      margin-left: 20px;
      border-left: 2px solid #334155;
      padding-left: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .period-badge {
      background: #ef4444;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
    }

    .timer {
      font-size: 24px;
      color: #ffffff;
      font-family: monospace;
    }

    /* OVERLAY ANIMADO DE GOL */
    #goal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }

    #goal-overlay.active {
      opacity: 1;
    }

    .goal-title {
      font-size: 120px;
      color: #eab308;
      text-shadow: 0 0 20px #ef4444, 0 0 40px #eab308;
      animation: pulse 0.6s infinite alternate;
      margin: 0;
      text-transform: uppercase;
    }

    .goal-team {
      font-size: 55px;
      color: white;
      margin-top: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      text-transform: uppercase;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <div id="scoreboard">
    <img id="homeLogo" class="team-logo" style="display:none;">
    <span class="team-name" id="homeName">LOCAL</span>
    <span class="score" id="homeScore">0</span>
    <span style="font-size:20px; color:#64748b;">:</span>
    <span class="score" id="awayScore">0</span>
    <span class="team-name" id="awayName">VISITANTE</span>
    <img id="awayLogo" class="team-logo" style="display:none;">

    <div class="timer-box">
      <span class="period-badge" id="period">1T</span>
      <span class="timer" id="timer">00:00</span>
    </div>
  </div>

  <!-- CARTEL DE GOL -->
  <div id="goal-overlay">
    <h1 class="goal-title">¡¡GOOOOOL!!</h1>
    <div class="goal-team" id="goalTeamName">EQUIPO</div>
  </div>

  <script>
    const socket = io();

    socket.on('updateState', (state) => {
      document.getElementById('homeName').innerText = state.homeName || 'LOCAL';
      document.getElementById('awayName').innerText = state.awayName || 'VISITANTE';
      document.getElementById('homeScore').innerText = state.homeScore !== undefined ? state.homeScore : 0;
      document.getElementById('awayScore').innerText = state.awayScore !== undefined ? state.awayScore : 0;
      
      // AQUÍ SE CORRIGE EL PERÍODO (1T, 2T, etc.)
      document.getElementById('period').innerText = state.period || '1T';

      let mins = Math.floor((state.seconds || 0) / 60).toString().padStart(2, '0');
      let secs = ((state.seconds || 0) % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;

      if (state.homeLogo) {
        document.getElementById('homeLogo').src = state.homeLogo;
        document.getElementById('homeLogo').style.display = 'inline';
      } else {
        document.getElementById('homeLogo').style.display = 'none';
      }

      if (state.awayLogo) {
        document.getElementById('awayLogo').src = state.awayLogo;
        document.getElementById('awayLogo').style.display = 'inline';
      } else {
        document.getElementById('awayLogo').style.display = 'none';
      }
    });

    socket.on('triggerGoal', (data) => {
      const overlay = document.getElementById('goal-overlay');
      const teamLabel = document.getElementById('goalTeamName');

      teamLabel.innerText = data.teamName;
      overlay.classList.add('active');

      setTimeout(() => {
        overlay.classList.remove('active');
      }, 5000);
    });
  </script>
</body>
</html>
